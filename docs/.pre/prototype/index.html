function buildPeriods(){const root={id:'season',label:'봄 마라톤 시즌',level:'Season',start:'2026-09-01',end:'2027-03-01',parent:null,children:[]};periods[root.id]=root;const specs=[['w1','가을 스피드','2026-09-01','2026-11-01'],['w2','지구력 전환','2026-11-01','2026-12-11'],['w3','마라톤 준비','2026-12-11','2027-03-01']];specs.forEach(([id,label,start,end],w)=>{const wave={id,label,level:'Wave',start,end,parent:'season',children:[]};periods[id]=wave;root.children.push(id);const length=diffDays(start,end),count=Math.ceil(length/30);let offset=0;for(let p=0;p<count;p++){const len=Math.floor(length/count)+(p<length%count?1:0),pid=`${id}p${p}`;const phase={id:pid,label:['기반 다지기','점진적 발전','목표 특이 준비'][p%3],level:'Phase',start:plusDate(start,offset),end:plusDate(start,offset+len),parent:id,children:[]};periods[pid]=phase;wave.children.push(pid);let b=0;for(let d=0;d<len;d+=10){const bid=`${pid}b${b}`,bs=plusDate(phase.start,d),be=plusDate(phase.start,Math.min(d+10,len));const block={id:bid,label:`Block ${w+1}.${p+1}.${b+1}`,level:'Block',start:bs,end:be,parent:pid,children:[]};periods[bid]=block;phase.children.push(bid);for(let n=0;n<diffDays(bs,be);n++){const date=plusDate(bs,n),did=bid+'d'+n;periods[did]={id:did,label:short(date)+' 계획',level:'Day',start:date,end:plusDate(date,1),parent:bid,children:[]};block.children.push(did)}b++}offset+=len}})}buildPeriods();
const navItems=[['dashboard','home','오늘'],['planner','plan','계획'],['activities','activity','활동'],['courses','map','코스'],['races','race','대회 · 기록'],['gallery','image','갤러리'],['resources','book','자료실'],['settings','settings','연결 · 설정']];
function renderNav(){document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="brandmark"></div>WAVE</div><nav aria-label="주요 메뉴">${navItems.map(([id,ic,label],i)=>`${i===3?'<div class="navlabel">EXPLORE</div>':''}<button class="navbtn ${state.page===id?'active':''}" data-nav="${id}" ${state.page===id?'aria-current="page"':''}>${icon(ic)}${label}</button>`).join('')}</nav><div class="sidebarfoot"><div class="row"><div class="avatar">JW</div><div><strong style="font-size:12px">Jiwon의 워크스페이스</strong><div style="font-size:10px" class="muted">개인 코치 · 디자인 연구</div></div></div><div class="footer-note">조금씩, 더 나은 다음을 향해.</div></div>`;document.getElementById('bottomnav').innerHTML=[navItems[0],navItems[1],navItems[2],['coach','chat','코치'],['menu','grid','더보기']].map(([id,ic,label])=>`<button ${id==='coach'||id==='menu'?`data-action="${id}"`:`data-nav="${id}"`} class="${id===state.page?'active':''}">${icon(ic)}${label}</button>`).join('');document.getElementById('themebutton').innerHTML=icon('moon');document.getElementById('coachbutton').innerHTML=icon('chat');document.getElementById('version-label').textContent='계획 v'+state.version}
function head(eyebrow,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function arcPath(a,b,r1=82,r2=112){const xy=(r,d)=>[135+r*Math.cos((d-90)*Math.PI/180),135+r*Math.sin((d-90)*Math.PI/180)];const p0=xy(r2,a),p1=xy(r2,b),p2=xy(r1,b),p3=xy(r1,a),large=b-a>180?1:0;return `M${p0}A${r2},${r2} 0 ${large} 1 ${p1}L${p2}A${r1},${r1} 0 ${large} 0 ${p3}Z`}
const ringColors=['#a399d2','#84aaa8','#d1ad96','#a9b8cd','#b0b77e','#bd9caf','#94a1c8','#a6c4bc','#c8b797','#b9b1d2'];
function orbit(){let p=periods[state.period];const cs=p.children.map(x=>periods[x]);let before=0;const total=cs.reduce((s,c)=>s+diffDays(c.start,c.end),0);const paths=cs.map((c,i)=>{const start=before/total*360;before+=diffDays(c.start,c.end);let end=before/total*360;return `<path class="sector" d="${arcPath(start+.7,end-.7)}" fill="${ringColors[i%ringColors.length]}" data-period="${c.id}" role="button" tabindex="0" aria-label="${esc(c.label)}, ${diffDays(c.start,c.end)}일, 자세히"><title>${esc(c.label)} · ${short(c.start)}–${short(plusDate(c.end,-1))}</title></path>`}).join('');let crumbs=[];let cp=p;while(cp){crumbs.unshift(cp);cp=periods[cp.parent]}

function nSelector(){return `<div class="segmented" aria-label="조회 기간">${[7,10,14,28].map(n=>`<button data-n="${n}" class="${n===state.n?'active':''}" aria-pressed="${n===state.n}">${n}일</button>`).join('')}</div>`}
function activityRows(count){return activities.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,count).map(a=>`<div class="activity-row"><div class="activity-icon">${icon('run')}</div><button style="text-align:left;padding:0" data-detail="${a.id}"><h3>${esc(a.title)}</h3><small>${short(a.date)} · ${esc(a.source)}</small></button><span class="value">${fmt(a.km)} <small>km</small></span></div>`).join('')}
function dashboard(){let w=windowStats();return head('TUESDAY, SEPTEMBER 15','다음 훈련을, 더 현명하게.','계획의 의도는 유지하고, 오늘의 상태에 맞춰 조정해요.',`<button class="btn" data-action="checkin">${icon('plus')} 체크인</button>`)+`<div class="stack"><section class="hero-card"><div class="row between wrap"><span class="tag">오늘의 가상 계획</span><span class="badgedate">Phase 01 · Block 02</span></div><h2 style="margin-top:16px">서두르지 않고,<br>다음 자극을 위한 여유를.</h2><div class="hero-meta"><div><strong>8.0</strong> <span>km 예정</span></div><div><strong>이지런</strong> <span>훈련 목적</span></div><div><strong>미확인</strong> <span>체크인</span></div></div><div class="row wrap"><button class="btn primary" data-nav="planner">계획 살펴보기 ${icon('arrow')}</button><button class="btn" data-action="coach">코치와 검토</button></div><div class="mutedcaption">디자인 검토용 일정입니다. 실제 훈련 권고가 아닙니다.</div></section><div class="three"><div class="minicard"><div class="measurelabel">최근 ${state.n}일 거리</div><div class="measure">${fmt(w.km)}<span>km</span></div><small>등록된 예시 활동 합계</small></div><div class="minicard"><div class="measurelabel">활동 시간</div><div class="measure">${Math.floor(w.minutes/60)}<span>h</span> ${w.minutes%60}<span>m</span></div><small>입력한 duration 기준</small></div><div class="minicard"><div class="measurelabel">현재 데이터</div><div class="measure">${w.rows.length}<span>개 활동</span></div><small>공식 API 연결 전</small></div></div><div class="two"><section class="glass card"><div class="cardhead"><div><div class="eyebrow">THE BIG PICTURE</div><h2>나의 훈련 주기</h2></div><button class="iconbtn" data-action="orbithelp" aria-label="주기 탐색 설명">${icon('info')}</button></div>${orbit()}<div class="mutedcaption">원을 선택해 탐색해 보세요. 각도는 기간의 길이입니다.</div></section><section class="glass card"><div class="cardhead"><div><div class="eyebrow">ROLLING WINDOW</div><h2>흐름을 살펴보기</h2></div></div>${nSelector()}${bars()}<div class="hr"></div><div class="row between"><span class="muted" style="font-size:12px">고정 블록과 별개인 조회 창</span><button class="tablebtn" data-nav="activities">활동 보기 ↗</button></div></section></div><section class="glass card"><div class="cardhead"><div><div class="eyebrow">RECENT ACTIVITIES</div><h2>최근의 움직임</h2></div><button class="tablebtn" data-nav="activities">모두 보기 ↗</button></div>${activityRows(3)}</section></div>`}
function planTable(){const rows=(state.draft||sessions).slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="tablewrap"><table><thead><tr><th>날짜</th><th>세션</th><th>예정 거리</th><th>상태</th><th>이동</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${short(s.date)}</td><td>${esc(s.title)}</td><td>${fmt(s.km)} km</td><td><span class="tag ${s.date<=TODAY?'teal':''}">${s.date<=TODAY?'과거 계획':'예정'}</span></td><td>${s.date>TODAY?`<select class="rowselect" data-move="${s.id}" aria-label="${esc(s.title)} 날짜 이동">${[16,17,18,19,20].map(d=>`<option value="2026-09-${d}" ${s.date===`2026-09-${d}`?'selected':''}>9.${d}</option>`).join('')}</select>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
function planner(){const list=state.draft||sessions;return head('PLANNING WORKSPACE','계획의 큰 그림과, 오늘.','원형 탐색과 달력·표가 같은 계획을 봅니다.',`<button class="btn" data-action="review">${icon('spark')} 제안 검토</button>`)+`<div class="stack"><section class="glass card"><div class="cardhead"><div><div class="eyebrow">PERIOD EXPLORER</div><h2>시즌 → Wave → Phase → Block</h2></div><button class="tablebtn" data-period="season">처음으로</button></div>${orbit()}</section><section class="glass card"><div class="cardhead"><div><h2>9월 7일 – 20일</h2><small>날짜 이동은 승인 전까지 초안입니다.</small></div><div class="segmented"><button data-view="calendar" class="${state.plannerView==='calendar'?'active':''}">${icon('grid')}</button><button data-view="table" class="${state.plannerView==='table'?'active':''}">${icon('list')}</button></div></div>${state.draft?`<div class="draftbar"><span>날짜 이동 초안 · 아직 미적용</span><div class="row"><button class="tablebtn" data-action="discard-draft">취소</button><button class="btn small" data-action="apply-draft">변경 확인</button></div></div>`:''}${state.plannerView==='table'?planTable():`<div class="calendar">${['월','화','수','목','금','토','일'].map(d=>`<div class="dayhead">${d}</div>`).join('')}${Array.from({length:14},(_,i)=>{let d=plusDate('2026-09-07',i);return `<div class="daycell ${d===TODAY?'today':''}" data-drop="${d}"><div class="daynumber">${short(d)} ${d===TODAY?'<span>오늘</span>':''}</div>${list.filter(s=>s.date===d).map(s=>`<button class="session-chip ${s.date<=TODAY?'past':''}" ${s.date>TODAY?'draggable="true"':''} data-session="${s.id}">${esc(s.title)}<br>${fmt(s.km)} km</button>`).join('')}</div>`}).join('')}</div>`}<div class="mutedcaption">미래 세션을 드래그하거나 클릭해 날짜를 바꿉니다. 과거 계획은 이 화면에서 덮어쓰지 않습니다.</div></section></div>`}
function activitiesPage(){const list=activities.filter(a=>(a.title+a.source+a.date).toLowerCase().includes(state.filter.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return head('ACTIVITY LIBRARY','움직임은 기록으로 남습니다.','원본 출처와 수정 이력을 구분해 관리합니다.',`<button class="btn primary" data-action="add-activity">${icon('plus')} 활동 등록</button>`)+`<section class="glass card"><div class="toolbar"><input id="activity-search" placeholder="활동 이름·날짜·출처 검색" value="${esc(state.filter)}" aria-label="활동 검색"><span class="tag">${list.length}개</span></div><div class="tablewrap"><table><thead><tr><th>날짜</th><th>활동</th><th>거리</th><th>시간</th><th>출처</th><th>관리</th></tr></thead><tbody>${list.map(a=>`<tr><td>${short(a.date)}</td><td><button class="tablebtn" data-detail="${a.id}">${esc(a.title)}</button></td><td class="num">${fmt(a.km)} km</td><td class="num">${a.minutes}분</td><td><small>${esc(a.source)}</small></td><td><button class="tablebtn" data-edit="${a.id}">수정</button><button class="tablebtn" style="color:var(--danger)" data-delete="${a.id}">삭제</button></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">조건에 맞는 활동이 없습니다.</div>'}</div><p class="mutedcaption">이 파일 안의 예시 데이터만 변경됩니다. 실제 Garmin 계정에는 접근하지 않습니다.</p></section>`}
function mapSvg(points=state.waypoints,interactive=false){return `<svg class="mapcanvas" ${interactive?'id="route-canvas"':''} viewBox="0 0 820 330" role="img" aria-label="도로 지도가 아닌 경로 편집 모식도"><path d="M-10 205C160 290 210 300 350 234S580 185 850 235" stroke="#abc8ca" stroke-width="48" fill="none"/><path class="schematic" d="M0 80 180 60 420 105 820 60M0 120 200 108 420 155 820 110M80 0 200 330M300 0 440 330M540 0 645 330M720 0 800 330"/><path d="M0 280Q220 175 430 252T830 283" class="schematic"/><text x="25" y="32" fill="#586e73" font-size="12">경로 모식도 · 실제 도로 / 좌표 없음</text><polyline class="route-line" points="${points.map(p=>`${p.x},${p.y}`).join(' ')}"/>${points.map((p,i)=>`<circle class="waypoint" cx="${p.x}" cy="${p.y}" r="7"/><text x="${p.x+12}" y="${p.y-11}" fill="#51439a" font-size="11">${i+1}</text>`).join('')}</svg>`}
function coursesPage(){return head('COURSES & ROUTES','좋은 경로를 준비해요.','경유점 편집 UI를 위한 모식도입니다. 실제 routing은 연결하지 않았습니다.')+`<div class="stack"><section class="glass card"><div class="cardhead"><div><h2>새 코스 초안</h2><small>캔버스를 클릭하면 경유점이 추가됩니다.</small></div><span class="tag warn">지도 API 미연결</span></div>${mapSvg(state.waypoints,true)}<div class="row between wrap" style="margin-top:16px"><span class="muted">${state.waypoints.length}개 경유점 · 실제 거리 미산출</span><div class="row wrap"><button class="btn small" data-action="waypoint-undo">마지막 점 취소</button><button class="btn small" data-action="waypoint-add">중앙 점 추가</button><button class="btn small" data-action="waypoint-reset">초기화</button><button class="btn small primary" data-action="course-save">로컬 초안 저장</button></div></div></section>${state.courseSaved?`<div class="notice">코스 초안을 이 실행 화면에 저장했습니다. 도로 routing 및 통행 가능성은 확인되지 않았습니다.</div>`:''}<div class="notice">실제 구현: MapLibre 지도 + 서버 Directions adapter + 장소 검색 + 고도·노면 정보. 경로를 찾지 못한 직선은 달릴 수 있는 경로로 확정하지 않습니다.</div></div>`}
function racesPage(){return head('RACES & PERSONAL RECORDS','목표를 정하고, 과정을 남겨요.','아래 대회와 기록은 UI 구성을 위한 가상 예시입니다.')+`<div class="stack"><section class="hero-card"><div class="row between"><span class="tag">목표 대회 · 가상</span>${icon('race')}</div><h2 style="margin-top:18px">봄 목표 마라톤</h2><p class="muted" style="margin-top:7px">2027.03.01 · 일정 시나리오 예시</p><div class="hero-meta"><div><strong>42.195</strong> <span>km</span></div><div><strong>주요 목표</strong></div></div><button class="btn" data-nav="planner">연결된 계획 살펴보기 ${icon('arrow')}</button></section><section class="glass card"><h2>기록의 출처를 구분합니다</h2><div class="tablewrap" style="margin-top:17px"><table><thead><tr><th>종목</th><th>기록 예시</th><th>유형</th><th>검증</th></tr></thead><tbody><tr><td>10 km</td><td>38:20</td><td>수동 입력 예시</td><td>미확인</td></tr><tr><td>Half</td><td>1:24:00</td><td>가상 대회 결과</td><td>미확인</td></tr></tbody></table></div><div class="mutedcaption">실제 개인 기록이 아닙니다. 공식 결과와 기기 추정 split을 별도로 관리하는 구조를 보여줍니다.</div></section></div>`}
function galleryPage(){return head('MEMORIES IN MOTION','기록 너머의 순간들.','사진과 동영상을 로컬로 미리 봅니다. 서버로 전송하지 않습니다.',`<label class="btn primary" for="media-input">${icon('plus')} 파일 선택</label>`)+`<input type="file" id="media-input" accept="image/*,video/*" multiple style="display:none">${state.media.length?`<div class="media-grid">${state.media.map(m=>`<div class="media-item">${m.type.startsWith('video')?`<video src="${m.url}" controls playsinline preload="metadata" aria-label="${esc(m.name)}"></video>`:`<button data-media="${m.id}" aria-label="${esc(m.name)} 크게 보기"><img src="${m.url}" alt="${esc(m.name)}"></button>`}</div>`).join('')}</div><button class="btn" style="margin-top:18px" data-action="clear-media">로컬 미리보기 지우기</button>`:`<section class="glass empty">${icon('image')}<h2>러닝의 장면을 모아보세요.</h2><p>기기에 있는 사진·동영상을 선택하면 이 브라우저에서만 표시됩니다. 새로고침하면 사라집니다.</p><label class="btn" for="media-input">사진 또는 동영상 선택</label></section>`}`}
function resourcesPage(){const list=resources.filter(r=>(r.title+r.tag).includes(state.resourcesFilter));return head('RESOURCE ARCHIVE','좋은 코칭에는, 좋은 근거가.','자료 보관과 “코치가 사용할 수 있음”은 별도의 상태입니다.',`<button class="btn primary" data-action="add-resource">${icon('plus')} 노트 추가</button>`)+`<div class="toolbar"><input id="resource-search" placeholder="자료 이름·태그 검색" value="${esc(state.resourcesFilter)}" aria-label="자료 검색"><span class="tag">로컬 예시 · 미색인</span></div><div class="two">${list.map(r=>`<article class="resource"><div class="row between"><span class="tag">${r.type}</span>${icon('book')}</div><button style="text-align:left;padding:0" data-resource="${r.id}"><h3>${esc(r.title)}</h3></button><p class="muted" style="font-size:12px">${esc(r.tag)} · 권한과 출처를 보존하는 구조</p><div class="hr"></div><label class="toggle"><input type="checkbox" data-resource-toggle="${r.id}" ${r.on?'checked':''}>코치 사용 설정 (예시)</label><div class="meta">실제 embedding / 검색 API는 연결되지 않았습니다.</div></article>`).join('')}</div><div class="notice" style="margin-top:18px">기기 수치와 계획은 구조화 조회로, 자료의 내용은 권한·버전이 있는 문서 검색으로 가져옵니다.</div>`}
function settingsPage(){return head('CONNECTIONS & PREFERENCES','나에게 맞는 워크스페이스.','연결 가능 범위와 수집 상태를 투명하게 보여줍니다.')+`<div class="stack"><div class="two"><section class="glass card"><div class="cardhead"><div><div class="eyebrow">ACTIVITY & HEALTH API</div><h2>Garmin Connect</h2></div><span class="tag warn">미연결</span></div><p class="muted" style="font-size:12px">공식 프로그램 승인과 OAuth 연결이 필요합니다. 이 데모는 Garmin 비밀번호를 받지 않습니다.</p><button class="btn" style="margin-top:17px" data-action="garmin-info">연동 조건 확인 ${icon('arrow')}</button></section><section class="glass card"><div class="cardhead"><div><div class="eyebrow">NATIVE CAPABILITY</div><h2>Apple Health</h2></div><span class="tag">iOS 앱 필요</span></div><p class="muted" style="font-size:12px">HealthKit native 수집기를 통해 자체 서버와 동기화합니다. Apple 로그인만으로 건강 데이터를 받지 않습니다.</p><button class="btn" style="margin-top:17px" data-action="apple-info">수집 구조 확인 ${icon('arrow')}</button></section></div><section class="glass card"><h2>화면과 상호작용</h2><div class="settings-row"><div><h3>컬러 테마</h3><small>안개처럼 차분하게, 혹은 선명한 Aurora</small></div><select id="theme-select" aria-label="컬러 테마"><option value="mist" ${document.documentElement.dataset.theme==='mist'?'selected':''}>Alpine Mist</option><option value="aurora" ${document.documentElement.dataset.theme==='aurora'?'selected':''}>Aurora</option></select></div><div class="settings-row"><div><h3>투명도 줄이기</h3><small>글래스 대신 불투명 면을 사용합니다.</small></div><label class="toggle"><input id="transparency-check" type="checkbox" ${document.documentElement.dataset.transparency==='reduced'?'checked':''}>적용</label></div><div class="settings-row"><div><h3>동작 줄이기</h3><small>전환 효과를 줄입니다. OS 설정도 존중합니다.</small></div><label class="toggle"><input id="motion-check" type="checkbox" ${document.documentElement.dataset.motion==='reduced'?'checked':''}>적용</label></div><div class="settings-row"><div><h3>조회 기간</h3><small>고정 훈련 블록과 별개의 rolling 창</small></div>${nSelector()}</div></section><section class="glass card"><h2>숫자의 의미</h2><div class="settings-row"><div><h3>기기 점수</h3><small>제공자·정의·관측 시각을 함께 표시</small></div><span class="tag">미수집</span></div><div class="settings-row"><div><h3>주관적 피로</h3><small>보고하지 않은 값은 0이 아닙니다.</small></div><button class="btn small" data-action="checkin">체크인</button></div><div class="settings-row"><div><h3>부상 관련 확인 신호</h3><small>검증되지 않은 부상 확률은 만들지 않습니다.</small></div><span class="tag warn">판단 정보 부족</span></div></section></div>`}
const renderers={dashboard,planner,activities:activitiesPage,courses:coursesPage,races:racesPage,gallery:galleryPage,resources:resourcesPage,settings:settingsPage};
function render(){renderNav();document.getElementById('main').innerHTML=renderers[state.page]();renderCoach();bindDirect()}
function renderCoach(){document.getElementById('coach').innerHTML=`<div class="coach-head"><div class="row between"><div class="coach-title"><span class="spark">${icon('spark')}</span><strong>나의 코치</strong></div><button class="iconbtn" style="width:30px;height:30px;padding:6px" data-action="close-coach" aria-label="코치 패널 닫기">${icon('close')}</button></div><div class="context"><span>현재 블록</span><span>최근 ${state.n}일</span><span>계획 v${state.version}</span></div></div><div class="coach-body"><div class="eyebrow">A LITTLE CLARITY</div><p>계획을 바꾸기 전에,<br><strong>무엇을 지키고 싶은지</strong>부터 살펴볼게요.</p><div class="coach-note"><h3>이번 블록의 의도를 유지하면서</h3><p class="muted" style="font-size:12px">다음 세션만이 아니라 주변 일정과 현재 보고를 함께 확인하는 상담 흐름입니다.</p></div><div class="row wrap" style="gap:3px"><button class="evidence" data-action="evidence">${icon('link')} 계획 근거</button><button class="evidence" data-action="evidence">${icon('book')} 자료 출처</button></div><div class="proposal-mini"><span class="tag">미적용 제안 · 데모</span><h3>다음 세션의 분량을 조정하는 안</h3><p style="font-size:12px;color:var(--ink-muted)">원안과 변경안을 비교한 뒤,<br>명시적으로 적용합니다.</p><button class="btn" data-action="review">변경 전후 확인 ${icon('arrow')}</button></div><div id="messages">${state.messages.map(m=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div></div><div class="coach-footer"><div class="composer"><textarea id="composer" placeholder="다음 훈련에 대해 이야기해 보세요" aria-label="코치에게 메시지 입력"></textarea><button class="iconbtn" data-action="send" aria-label="예시 메시지 보내기">${icon('send')}</button></div><div class="statusline">대화 UI 데모 · 실제 LLM 호출 없음</div></div>`}
function notify(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,3500)}
let previousFocus=null;
function modal(title,body){previousFocus=document.activeElement;document.getElementById('dialog').innerHTML=`<div class="row between" style="margin-bottom:19px"><h2 id="modal-title">${title}</h2><button class="iconbtn" data-action="close-modal" aria-label="닫기">${icon('close')}</button></div>${body}`;document.getElementById('modal').hidden=false;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('#dialog input,#dialog textarea,#dialog button')?.focus(),0)}
function closeModal(){document.getElementById('modal').hidden=true;document.body.style.overflow='';if(previousFocus?.isConnected)previousFocus.focus()}
function showReview(){const target=sessions.find(s=>s.date>TODAY);state.proposal={basis:state.dataRev,version:state.version,target:target.id,before:target.km,after:Math.max(2,target.km-2)};paintReview()}
function paintReview(){let p=state.proposal,stale=p.basis!==state.dataRev||p.version!==state.version;modal('계획 변경을 확인해 주세요',`<span class="tag ${stale?'warn':''}">${stale?'새 기록으로 오래된 제안':'예시 후보 · 아직 미적용'}</span><p class="muted" style="margin-top:13px;font-size:13px">이 변경은 UI 승인 흐름을 보여주는 가상 예시입니다. 실제 훈련 권고가 아닙니다.</p><div class="compare"><div><small>현재 승인된 예시 계획 v${p.version}</small><strong>${fmt(p.before)} km</strong><span>다음 세션</span></div><div><small>변경 후보</small><strong>${fmt(p.after)} km</strong><span>분량 조정 · 날짜는 유지</span></div></div><div class="notice">후보는 서버의 기준 버전·수치·권한 검증을 거쳐야 합니다. 이 파일에서는 메모리 안의 버전 비교만 시연합니다.</div>${stale?'<p style="color:var(--peach);margin-top:15px">기준 데이터가 바뀌었습니다. 다시 검토한 후 승인해야 합니다.</p>':''}<div class="actions"><button class="btn small" data-action="stale-demo">새 기록 도착 시뮬레이션</button><button class="btn" data-action="close-modal">취소</button>${stale?'<button class="btn accent" data-action="review">다시 검토</button>':'<button class="btn accent" data-action="approve">예시 계획에 적용</button>'}</div>`)}
function activityForm(id){const a=id?activities.find(x=>x.id===id):{title:'새 러닝',date:TODAY,km:8,minutes:45,rpe:3};modal(id?'활동 정정':'활동 등록',`<p class="muted" style="font-size:12px;margin-bottom:17px">로컬 예시 데이터만 변경됩니다. 원본 provider에 쓰지 않습니다.</p><form id="activity-form" data-id="${id||''}"><div class="gridform"><label class="field wide">활동 이름<input name="title" required maxlength="100" value="${esc(a.title)}"></label><label class="field">수행 날짜<input type="date" name="date" value="${a.date}" required></label><label class="field">거리 (km)<input type="number" name="km" min="0" max="500" step="0.1" value="${a.km}" required></label><label class="field">시간 (분)<input type="number" name="minutes" min="1" max="10080" step="1" value="${a.minutes}" required></label><label class="field">체감 강도 0–10 (선택)<input type="number" name="rpe" min="0" max="10" step="1" value="${a.rpe??''}"></label></div><div class="actions"><button class="btn" type="button" data-action="close-modal">취소</button><button class="btn accent" type="submit">예시 기록 저장</button></div></form>`);document.getElementById('activity-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),value={id:id||'a'+(++uid),title:String(f.get('title')).trim(),date:String(f.get('date')),km:Number(f.get('km')),minutes:Number(f.get('minutes')),rpe:f.get('rpe')===''?null:Number(f.get('rpe')),source:id?'로컬 정정 예시':'수동 예시'};if(!value.title||!Number.isFinite(value.km)||value.km<0||value.minutes<=0)return;if(id)activities=activities.map(x=>x.id===id?value:x);else activities.push(value);state.dataRev++;closeModal();render();notify('예시 활동을 저장했습니다.')};}
function detail(id){const a=activities.find(x=>x.id===id);modal(esc(a.title),`<div class="row wrap"><span class="tag">${esc(a.source)}</span><span class="muted">${a.date} · 가상 데이터</span></div><div class="three" style="margin:20px 0"><div class="minicard"><div class="measurelabel">거리</div><div class="measure">${fmt(a.km)}<span>km</span></div></div><div class="minicard"><div class="measurelabel">시간</div><div class="measure">${a.minutes}<span>분</span></div></div><div class="minicard"><div class="measurelabel">체감 강도</div><div class="measure">${a.rpe??'—'}<span>/10</span></div></div></div><h3>시계열 시각화 형식 예시</h3><svg class="detailchart" viewBox="0 0 700 140" role="img" aria-label="가상 차트; 실제 샘플 아님"><path d="M0 110H700M0 65H700M0 20H700" stroke="var(--line)" fill="none"/><path d="M0 70Q25 10 60 53T130 70T180 36T240 60T300 43T360 68T420 32T480 68T540 49T620 63T700 44" stroke="var(--accent)" stroke-width="2.5" fill="none"/></svg>${mapSvg([{x:110,y:231},{x:202,y:130},{x:310,y:90},{x:437,y:130},{x:533,y:94},{x:666,y:124}])}<div class="notice" style="margin-top:16px">영향 분석은 계획 대비 차이와 해당 기간에 기여한 거리·시간을 구분합니다. 위 차트와 경로는 모식도이며 센서 기록이나 부상 확률이 아닙니다.</div><div class="actions"><button class="btn" data-edit="${a.id}">기록 정정</button><button class="btn accent" data-action="close-modal">닫기</button></div>`)}
function draftMove(id,date){if(date<=TODAY){notify('과거 계획으로 이동할 수 없습니다.');return}if(!state.draft)state.draft=sessions.map(s=>({...s}));state.draft=state.draft.map(s=>s.id===id?{...s,date}:s);render();notify('날짜 이동을 초안으로 보관했습니다.')}
function sessionDialog(id){const s=(state.draft||sessions).find(x=>x.id===id);if(s.date<=TODAY){modal('과거 계획',`<p>${short(s.date)} · ${esc(s.title)} · ${s.km} km</p><p class="muted" style="margin-top:12px">과거 계획은 미래 조정 화면에서 변경하지 않습니다. 실제 기록 정정은 활동 화면을 이용합니다.</p><div class="actions"><button class="btn" data-nav="activities">활동 보기</button><button class="btn" data-action="close-modal">닫기</button></div>`);return}modal('세션 날짜 이동',`<p>${esc(s.title)} · ${s.km} km</p><label class="field" style="margin-top:17px">새 날짜<select id="move-date">${[16,17,18,19,20].map(d=>`<option value="2026-09-${d}" ${s.date===`2026-09-${d}`?'selected':''}>2026.09.${d}</option>`).join('')}</select></label><div class="actions"><button class="btn" data-action="close-modal">취소</button><button class="btn accent" id="move-confirm">초안에 반영</button></div>`);document.getElementById('move-confirm').onclick=()=>{const d=document.getElementById('move-date').value;closeModal();draftMove(id,d)}}
function checkin(){modal('지금 상태를 기록해요',`<p class="muted" style="font-size:13px;margin-bottom:20px">실제 건강 기록이 아닌 폼 동작 예시입니다. 응답하지 않은 항목을 정상으로 취급하지 않습니다.</p><label class="field">현재 주관적 피로 (0=전혀 없음, 10=매우 심함)<input id="fatigue" type="range" min="0" max="10" value="4" aria-label="피로 예시"><output id="fatigue-value">4 / 10</output></label><label class="field" style="margin-top:18px">전달할 내용<textarea id="checkin-note" placeholder="시간 부족, 다리의 느낌 등"></textarea></label><div class="actions"><button class="btn" data-action="close-modal">취소</button><button class="btn accent" data-action="save-checkin">로컬 예시 저장</button></div>`);document.getElementById('fatigue').oninput=e=>document.getElementById('fatigue-value').textContent=e.target.value+' / 10'}
function resourceDetail(id){const r=resources.find(r=>r.id===id);modal(esc(r.title),`<div class="row wrap"><span class="tag">${esc(r.type)}</span><span class="tag warn">가상 자료 · 실제 근거 아님</span></div><div class="notesbody">${esc(r.text)}</div><div class="hr"></div><small>실제 구현에서는 resourceVersion + 문단/page/time 위치를 코치 답변과 연결합니다.</small><div class="actions"><button class="btn" data-action="close-modal">닫기</button></div>`)}
function addResource(){modal('자료실에 노트 추가',`<form id="resource-form"><div class="stack"><label class="field">제목<input name="title" maxlength="120" required></label><label class="field">내용<textarea name="text" required maxlength="6000"></textarea></label><span class="notice">이 파일의 메모리에만 저장됩니다. 실제 색인·RAG·외부 AI 전송은 없습니다.</span></div><div class="actions"><button type="button" class="btn" data-action="close-modal">취소</button><button type="submit" class="btn accent">로컬 노트 저장</button></div></form>`);document.getElementById('resource-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);resources.push({id:'r'+(++uid),title:String(f.get('title')),text:String(f.get('text')),type:'개인 노트',tag:'로컬 예시',on:false});closeModal();render();notify('자료를 추가했습니다. 코치 사용은 별도 선택입니다.')}}
function bindDirect(){document.getElementById('activity-search')?.addEventListener('input',e=>{const pos=e.target.selectionStart;state.filter=e.target.value;render();const el=document.getElementById('activity-search');el.focus();el.setSelectionRange(pos,pos)});document.getElementById('resource-search')?.addEventListener('input',e=>{const pos=e.target.selectionStart;state.resourcesFilter=e.target.value;render();const el=document.getElementById('resource-search');el.focus();el.setSelectionRange(pos,pos)});document.getElementById('route-canvas')?.addEventListener('click',e=>{const el=e.currentTarget,pt=el.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(el.getScreenCTM().inverse());if(p.x<0||p.x>820||p.y<0||p.y>330)return;state.waypoints.push({x:Math.round(p.x),y:Math.round(p.y)});render()});document.getElementById('media-input')?.addEventListener('change',e=>{for(const f of e.target.files){if(!/^(image|video)\//.test(f.type))continue;state.media.push({id:'m'+(++uid),name:f.name,type:f.type,url:URL.createObjectURL(f)})}render()});document.getElementById('theme-select')?.addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value});document.getElementById('transparency-check')?.addEventListener('change',e=>document.documentElement.dataset.transparency=e.target.checked?'reduced':'normal');document.getElementById('motion-check')?.addEventListener('change',e=>document.documentElement.dataset.motion=e.target.checked?'reduced':'normal');document.querySelectorAll('[data-move]').forEach(el=>el.onchange=e=>draftMove(el.dataset.move,e.target.value));document.querySelectorAll('[data-resource-toggle]').forEach(el=>el.onchange=e=>{resources.find(r=>r.id===el.dataset.resourceToggle).on=e.target.checked;notify('예시 코치 사용 설정을 변경했습니다. 실제 색인은 아닙니다.')});document.querySelectorAll('[draggable=true]').forEach(el=>el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.session);e.dataTransfer.effectAllowed='move'});document.querySelectorAll('[data-drop]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('dragover')};el.ondragleave=()=>el.classList.remove('dragover');el.ondrop=e=>{e.preventDefault();el.classList.remove('dragover');const id=e.dataTransfer.getData('text/plain');if(sessions.some(s=>s.id===id))draftMove(id,el.dataset.drop)}})}
function setPage(id){if(!renderers[id])return;state.page=id;document.getElementById('sidebar').classList.remove('open');closeModal();render();window.scrollTo(0,0);document.getElementById('main').focus({preventScroll:true})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-period],[data-n],[data-action],[data-detail],[data-edit],[data-delete],[data-view],[data-session],[data-resource],[data-media]');if(!el)return;if(el.dataset.nav){setPage(el.dataset.nav);return}if(el.dataset.period){state.period=el.dataset.period;render();return}if(el.dataset.n){state.n=Number(el.dataset.n);render();return}if(el.dataset.view){state.plannerView=el.dataset.view;render();return}if(el.dataset.detail){detail(el.dataset.detail);return}if(el.dataset.edit){activityForm(el.dataset.edit);return}if(el.dataset.delete){let id=el.dataset.delete;modal('예시 활동 삭제',`<p>이 파일의 예시 목록에서 삭제합니다. Garmin 원본은 변경되지 않습니다.</p><div class="actions"><button class="btn" data-action="close-modal">취소</button><button id="delete-confirm" class="btn danger">예시 기록 삭제</button></div>`);document.getElementById('delete-confirm').onclick=()=>{activities=activities.filter(a=>a.id!==id);state.dataRev++;closeModal();render();notify('예시 목록에서 삭제했습니다.')};return}if(el.dataset.session){sessionDialog(el.dataset.session);return}if(el.dataset.resource){resourceDetail(el.dataset.resource);return}if(el.dataset.media){const m=state.media.find(m=>m.id===el.dataset.media);modal(esc(m.name),`<img class="preview-img" src="${m.url}" alt="${esc(m.name)}"><div class="actions"><button class="btn" data-action="close-modal">닫기</button></div>`);return}
const a=el.dataset.action;if(a==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(a==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='mist'?'aurora':'mist';if(state.page==='settings')render();return}if(a==='coach'){const area=document.getElementById('workarea');area.classList.remove('coachclosed');area.classList.toggle('forcecoach');document.getElementById('composer')?.focus();return}if(a==='close-coach'){document.getElementById('workarea').classList.add('coachclosed');document.getElementById('workarea').classList.remove('forcecoach');return}if(a==='close-modal'){closeModal();return}if(a==='review'){showReview();return}if(a==='stale-demo'){state.dataRev++;paintReview();return}if(a==='approve'){const p=state.proposal;if(!p||p.basis!==state.dataRev||p.version!==state.version){notify('새 데이터로 제안을 다시 검토해야 합니다.');return}sessions=sessions.map(s=>s.id===p.target?{...s,km:p.after}:s);state.version++;state.dataRev++;state.draft=null;state.proposal=null;closeModal();render();notify('예시 계획 v'+state.version+'에 적용했습니다.');return}if(a==='add-activity'){activityForm();return}if(a==='checkin'){checkin();return}if(a==='save-checkin'){state.dataRev++;closeModal();notify('체크인 폼 완료 예시입니다. 실제 건강 데이터는 저장하지 않습니다.');return}if(a==='send'){let ta=document.getElementById('composer'),text=ta.value.trim();if(!text)return;state.messages.push({role:'user',text},{role:'assistant',text:'[고정 예시 응답] 실제 에이전트는 현재 계획과 수행 근거를 조회한 후 후보를 만듭니다. 위 “변경 전후 확인”에서 승인 흐름을 체험할 수 있습니다.'});renderCoach();return}if(a==='evidence'){modal('근거 연결의 예시',`<p>실제 구현에서는 다음을 서로 다른 출처로 표시합니다.</p><div class="stack" style="margin-top:18px"><div class="notice">계획: 특정 PlanVersion과 세션 ID</div><div class="notice">수치: 관측·계산 정의와 입력 기록</div><div class="notice">자료: ResourceVersion과 page/문단/time locator</div></div><p class="muted" style="font-size:12px;margin-top:15px">현재 프로토타입에는 실제 RAG 검색이나 개인 데이터가 없습니다.</p>`);return}if(a==='orbithelp'){modal('원형 주기 탐색',`<p>중앙은 현재 기간, 주변은 자식 기간입니다. sector 각도는 기간의 길이를 나타냅니다.</p><div class="notice" style="margin-top:17px">Season → Wave → Phase → Block → Day 보기<br>원 또는 옆의 목록을 선택하세요. 중앙을 누르면 상위로 돌아갑니다.</div><p class="muted" style="margin-top:15px;font-size:12px">가상의 181일 계획입니다. 날짜는 실제 개인 계획에서 가져오지 않았습니다. rolling N-day와 주간 통계는 이 트리와 별도입니다.</p>`);return}if(a==='discard-draft'){state.draft=null;render();return}if(a==='apply-draft'){modal('날짜 이동 초안 적용',`<p>미래 세션의 날짜 이동을 예시 계획의 새 버전으로 저장합니다.</p><p class="muted" style="margin-top:13px">실제 서비스에서는 제약·겹침·최신성 검증 후 적용합니다. 이 화면은 로컬 동작만 보여줍니다.</p><div class="actions"><button class="btn" data-action="close-modal">취소</button><button class="btn accent" id="draft-confirm">예시 초안 적용</button></div>`);const rev=state.dataRev;document.getElementById('draft-confirm').onclick=()=>{if(rev!==state.dataRev)return notify('기준 정보가 바뀌었습니다.');sessions=state.draft;state.draft=null;state.version++;state.dataRev++;closeModal();render();notify('날짜 이동 초안을 적용했습니다.')};return}if(a==='waypoint-undo'){state.waypoints.pop();state.courseSaved=false;render();return}if(a==='waypoint-add'){state.waypoints.push({x:410,y:165});state.courseSaved=false;render();return}if(a==='waypoint-reset'){state.waypoints=[];state.courseSaved=false;render();return}if(a==='course-save'){if(state.waypoints.length<2){notify('최소 두 개 경유점을 지정하세요.');return}state.courseSaved=true;render();notify('현재 실행 안에 코스 초안을 보관했습니다.');return}if(a==='add-resource'){addResource();return}if(a==='clear-media'){state.media.forEach(m=>URL.revokeObjectURL(m.url));state.media=[];render();return}if(a==='garmin-info'){modal('Garmin 연동 전제',`<div class="notice">공식 Garmin Connect Developer Program의 신청·승인과 Activity API 권한을 먼저 확보합니다. 사용자 연결은 OAuth이며 앱이 Garmin 비밀번호를 보관하지 않습니다.</div><p style="margin-top:15px">Activity FIT와 Health API 지표는 서로 다른 capability로 처리합니다. Training Readiness 등 모든 화면 지표의 공개 API 제공을 가정하지 않습니다.</p><p class="muted" style="font-size:12px;margin-top:15px">이 프로토타입은 승인 신청이나 OAuth를 수행하지 않습니다.</p>`);return}if(a==='apple-info'){modal('Apple Health 수집 구조',`<div class="notice">iOS HealthKit → Native collector → 자체 ingestion API → Web/앱 화면</div><p style="margin-top:16px">웹사이트의 Apple 로그인만으로 건강 데이터가 제공되지는 않습니다. 데이터 유형별 동의, 증분·삭제 동기화, background 제약, 중복 수집 처리가 필요합니다.</p><p class="muted" style="font-size:12px;margin-top:15px">현재 이 파일에는 HealthKit native 코드가 없습니다.</p>`);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('sidebar').classList.remove('open');document.getElementById('workarea').classList.remove('forcecoach')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.sector')){e.preventDefault();state.period=e.target.dataset.period;render()}if(e.key==='Tab'&&!document.getElementById('modal').hidden){const els=[...document.querySelectorAll('#dialog button:not(:disabled),#dialog input,#dialog select,#dialog textarea,#dialog a')].filter(x=>x.offsetParent!==null),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const resizer=document.querySelector('.resizer');function setWidth(w){w=Math.max(270,Math.min(440,w));document.getElementById('workarea').style.setProperty('--coach-w',w+'px');resizer.setAttribute('aria-valuenow',String(Math.round(w)))}resizer.addEventListener('pointerdown',e=>{resizer.setPointerCapture(e.pointerId);const move=ev=>{const right=document.getElementById('workarea').getBoundingClientRect().right;setWidth(right-ev.clientX-28)};const stop=()=>{resizer.removeEventListener('pointermove',move);resizer.removeEventListener('pointerup',stop);resizer.removeEventListener('pointercancel',stop)};resizer.addEventListener('pointermove',move);resizer.addEventListener('pointerup',stop);resizer.addEventListener('pointercancel',stop)});resizer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setWidth(Number(resizer.getAttribute('aria-valuenow'))+(e.key==='ArrowLeft'?10:-10))}});
window.addEventListener('beforeunload',()=>state.media.forEach(m=>URL.revokeObjectURL(m.url)));
render();
</script></body></html>
