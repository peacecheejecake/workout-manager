name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: M0-01 tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M1-06b-tmp: the unofficial Garmin collector's bridge tests and E2E drive the Python
      # worker with its SYNTHETIC provider. The default install only: `uv sync --locked`
      # without `--extra garmin` never pulls garminconnect or curl_cffi.
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.8'
          python-version: '3.13'
      - run: uv sync --locked
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: M0-01 fixture E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The fixture app has no sign-in, cookie or token, so its trace carries no session
      # material (checked in M2-01ae) and the whole report is uploaded. Revisit this before
      # a fixture test signs in: the identity job below shows what to upload instead.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fixture-e2e-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: Local FIT batch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.8'
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  integration:
    name: PostgreSQL API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: workout_admin
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: workout_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workout_admin -d workout_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://workout_admin:test-only-password@localhost:5432/workout_test
      TEST_DATABASE_URL: postgresql://workout_runtime:test-only-password@localhost:5432/workout_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create restricted disposable runtime role
        run: psql "$TEST_DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE workout_runtime LOGIN PASSWORD 'test-only-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
      - run: pnpm test:integration

  shells:
    name: Next and Vite shell smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:shells

  identity:
    name: Identity browser API PostgreSQL E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare local PostgreSQL binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes postgresql-16
          fi
          echo "PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      # M1-06b-tmp: the unofficial Garmin collector's bridge tests and E2E drive the Python
      # worker with its SYNTHETIC provider. The default install only: `uv sync --locked`
      # without `--extra garmin` never pulls garminconnect or curl_cffi.
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.8'
          python-version: '3.13'
      - run: uv sync --locked
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify login, tenant consent isolation and logout
        # The harness owns a new private UNIX-socket database; it ignores inherited DB URLs.
        run: pnpm test:identity
        env:
          # Per-failure evidence in place of a trace (README "Identity E2E diagnostics").
          IDENTITY_E2E_DIAGNOSTICS: '1'
      # This repository is public, so anyone signed in can download these artifacts. A
      # Playwright trace keeps the session cookie, CSRF token, session id and OIDC values
      # unredacted: CI records none (playwright.identity.config.ts), and only the files listed
      # here are uploaded — never test-results/ or playwright-report/ as a whole.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: identity-e2e-failures
          # Each failed test's redacted protocol.log, pressure.log and summary.txt, its
          # screenshot and error context. The run-wide raw protocol logs (about 1 MB per test,
          # redacted the same way) stay on the runner.
          path: |
            playwright-report/identity-diagnostics/
            !playwright-report/identity-diagnostics/*/protocol-*.log
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore

  planned-gates:
    name: Not yet implemented gates
    runs-on: ubuntu-latest
    steps:
      - name: Report future gates without claiming verification
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Not executed: future implementation gates
          - M1 first slice: import/coaching/approval web/API/DB E2E
          - M3: native device/HealthKit validation
          Checks above cover tooling, contracts, local FIT, shells, API persistence and identity; full product acceptance remains open.
          SUMMARY
