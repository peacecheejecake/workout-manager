[project]
name = "workout-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fitparse>=1.2.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
# UNOFFICIAL personal Garmin download path only. `convert` and `export-activity`
# never import it, so local conversion and CI do not pull a scraping library or
# curl_cffi. Install with: uv sync --extra garmin
# Pinned exactly: the transport policy attaches to private session attributes and the
# token file name of this library, so an unreviewed release must not be used. Review
# the session layout and token handling before moving the pin.
garmin = [
    "garminconnect==0.3.16",
]

[project.scripts]
workout-manager = "workout_manager:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py313"
line-length = 100
