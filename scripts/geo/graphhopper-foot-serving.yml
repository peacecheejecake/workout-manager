# GraphHopper open-source pedestrian profile for the M2-01g internal routing engine.
#
# This is the self-hosted engine, not the hosted GraphHopper Directions API.
#
# Kept separate from `graphhopper-foot.yml` on purpose: that file is the exact profile
# whose SHA-256 the M2-01d candidate measurement recorded, and editing it would
# invalidate an existing evidence record. Until M2-01ay the import settings were
# byte-identical to it; since M2-01ay this profile encodes two more values, so a graph built
# from it is its own graph and needs a full import.
#
# Ferries (M2-01ay decision): GraphHopper's foot parser admits a mapped `route=ferry` unless it
# says `foot=no`, and this profile keeps that. The independent coverage review's pre-registered
# expectation (M0-06b, sha256 98ef1cee...) treats a mapped foot-allowed ferry as a legitimate
# walking connection that must be REPORTED; the adapter reports it as the
# `route_includes_ferry` warning (via `road_environment`) instead of dropping those
# connections.
#
# datareader.file, graph.location and the listener ports are supplied on the command
# line by the probe script so nothing outside .geo-build is touched and both connectors
# bind to loopback only. The engine is never exposed outside the host: reachability is
# an operations property, not something this file can prove.
graphhopper:
  datareader.file: ''
  graph.location: ''
  # M2-01ay: `road_environment` names ferry edges and `osm_way_id` the OSM way of every edge, so
  # a route can say when it takes a ferry or a way with a time-conditional access tag (the
  # adapter reads both as path details). GraphHopper 10.0 stores a way id in 31 bits; the
  # pinned extract's largest way id is 1,554,316,713.
  graph.encoded_values: foot_access, hike_rating, mtb_rating, foot_priority, foot_average_speed, road_class, road_access, surface, road_environment, osm_way_id
  # Pedestrian import: motorways and trunk roads carry no walking access.
  import.osm.ignored_highways: motorway,trunk
  # Military areas (M2-01ay) are not in this file: the build imports the graph from the pinned
  # extract with a barrier node (`foot=no`) inserted wherever a walkable way crosses the
  # perimeter of a `landuse=military` / `military=*` area (scripts/build-routing-graph.mts,
  # scripts/geo/MilitaryPerimeterBarriers.java), so no walking route enters or leaves one and
  # nothing is evaluated per request. A custom-model area was measured first and cost about 3x
  # per route: GraphHopper 10.0 re-serialises an area as text for every request.
  profiles:
    - name: foot
      custom_model_files: [foot.json]
  # No contraction hierarchies: the flexible path is what the adapter queries.
  profiles_ch: []
  profiles_lm: []
  routing.non_ch.max_waypoint_distance: 1000000
  # Last-resort backstop only: the cap on the per-request `timeout_ms`. The adapter sends
  # `max_visited_nodes` and a per-leg `timeout_ms` taken from its own deadline with every
  # route request (M2-01k-e), and those are the engine-side bounds that act. An exhausted
  # budget answers `ConnectionNotFoundException`, like a disconnected pair, so the adapter
  # tells the two apart by time. Set far above the adapter deadline (8 s).
  routing.timeout_ms: 30000

server:
  # M2-01af: no request log. Dropwizard's default request log writes every request line,
  # and a GET line carries its query. The adapter now POSTs its waypoints, but this file
  # must be safe for any client and for a launch outside the repository's helper. An empty
  # appender list is how Dropwizard switches it off (`isEnabled` is `!appenders.isEmpty()`).
  request_log:
    appenders: []
  application_connectors:
    - type: http
      port: 8991
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8992
      bind_host: 127.0.0.1

logging:
  # M2-01af: nothing below WARN is produced. GraphHopper 10.0 writes request content at INFO
  # from its HTTP endpoints: RouteResource, SPTResource, IsochroneResource, MapMatchingResource
  # and NavigateResource log the request's points, and MultiExceptionMapper and
  # IllegalArgumentExceptionMapper quote the failing point. The console threshold already hid
  # every INFO line, so this loses nothing that was visible.
  level: WARN
  # The three packages holding those endpoints are also pinned OFF, so a root level lowered to
  # INFO for a diagnosis does not bring the lines back. `resources` and `http` log nothing at
  # WARN or ERROR (jar bytecode). `navigation` does: NavigateResource has one ERROR (a failed
  # navigate answer) and NavigateResponseConverter one WARN, and OFF drops both. The adapter
  # never calls /navigate, so that is the chosen tradeoff. Only these packages were checked
  # for content; other INFO emitters in the jar (GraphHopper, LM/CH/subnetwork preparation,
  # the OSM reader, GTFS, GHUtility, LocationIndexTree, ...) look like import and startup code
  # by name and were not content-checked. This covers INFO only: at DEBUG, other emitters
  # (Dropwizard's JsonProcessingExceptionMapper, Jetty, GHJerseyViolationExceptionMapper) can
  # carry request content, so the root level is never lowered below INFO on a serving engine.
  loggers:
    com.graphhopper.resources: OFF
    com.graphhopper.http: OFF
    com.graphhopper.navigation: OFF
  # A third, independent layer: no appender accepts anything below WARN.
  appenders:
    - type: console
      threshold: WARN
